appId: com.silvergridtech.famcall.e2e
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: phone-number
    timeout: 30000
- tapOn:
    id: phone-number
- inputText: ${PHONE}
- hideKeyboard
- tapOn:
    id: send-code
- extendedWaitUntil:
    visible:
      id: verification-code
    timeout: 30000
