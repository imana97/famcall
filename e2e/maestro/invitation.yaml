appId: com.silvergridtech.famcall.e2e
---
# Authenticated local demo account, English selected; no SMS is ever sent.
- extendedWaitUntil:
    visible:
      id: contact-search
    timeout: 30000
- tapOn:
    id: open-dial-pad
- tapOn:
    id: 'dial-key-\+'
- tapOn:
    id: "dial-key-1"
- tapOn:
    id: "dial-key-2"
- tapOn:
    id: "dial-key-0"
- tapOn:
    id: "dial-key-2"
- tapOn:
    id: "dial-key-5"
- tapOn:
    id: "dial-key-5"
- tapOn:
    id: "dial-key-5"
- tapOn:
    id: "dial-key-0"
- tapOn:
    id: "dial-key-1"
- tapOn:
    id: "dial-key-9"
- tapOn:
    id: "dial-key-9"
- scrollUntilVisible:
    element:
      id: dial-call
    direction: DOWN
- tapOn:
    id: dial-call
- extendedWaitUntil:
    visible:
      id: invite-to-famcall
    timeout: 30000
- assertVisible: Invite them to FamCall
- assertNotVisible: Couldn’t connect right now.*
- assertNotVisible: Couldn’t finish that.*
- assertNotVisible:
    id: end-call
- assertNotVisible:
    id: mute-call
