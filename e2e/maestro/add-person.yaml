appId: com.silvergridtech.famcall.e2e
---
- tapOn:
    id: add-person
- tapOn:
    id: contact-name
- inputText: ${CONTACT_NAME}
- tapOn:
    id: contact-number
- inputText: ${CONTACT_PHONE}
- hideKeyboard
- tapOn:
    id: save-contact
- extendedWaitUntil:
    visible: Your people.
    timeout: 15000
- assertVisible: ${CONTACT_NAME}
