appId: com.silvergridtech.famcall.e2e
---
- tapOn:
    id: add-person
- tapOn:
    id: contact-name
- inputText: ${CONTACT_NAME}
- runFlow: dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      id: contact-number
    direction: DOWN
- tapOn:
    id: contact-number
- inputText: ${CONTACT_PHONE}
- runFlow: dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      id: save-contact
    direction: DOWN
- tapOn:
    id: save-contact
- extendedWaitUntil:
    visible: Your people.
    timeout: 15000
- assertVisible: Call ${CONTACT_NAME}
