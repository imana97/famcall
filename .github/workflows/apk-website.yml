name: Prepare Play-signed APK for website deployment
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Exact version code already active in Android internal testing
        required: true
        type: string
      ios_build:
        description: Optional iOS build number to finish TestFlight notes and existing tester access
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: famcall-apk-website
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'silvergrid/famcall' && github.ref == 'refs/heads/main' && github.actor == 'silvergrid' && github.triggering_actor == 'silvergrid'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Download and verify the APK signed by Google Play
        env:
          FAMCALL_PLAY_API_KEY_JSON: ${{ secrets.FAMCALL_PLAY_API_KEY_JSON }}
          FAMCALL_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          version=$(node -p "require('./apps/mobile/package.json').version")
          node scripts/download-play-apk.mjs "$FAMCALL_VERSION_CODE" "$version"
      - name: Finish TestFlight testing access and notes
        if: inputs.ios_build != ''
        env:
          FAMCALL_APPLE_API_KEY_JSON: ${{ secrets.FAMCALL_APPLE_API_KEY_JSON }}
          FAMCALL_IOS_BUILD: ${{ inputs.ios_build }}
        run: |
          version=$(node -p "require('./apps/mobile/package.json').version")
          node scripts/finish-testflight.mjs "$FAMCALL_IOS_BUILD" "$version"
      - name: Preserve the complete website and verified download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: famcall-apk-website
          path: website/
          retention-days: 7
          if-no-files-found: error
