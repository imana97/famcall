name: Finish TestFlight testing access and notes
on:
  workflow_dispatch:
    inputs:
      ios_build:
        description: Exact processed TestFlight build number for the current app version
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: famcall-store-build
  cancel-in-progress: false
jobs:
  access:
    if: github.repository == 'silvergrid/famcall' && github.ref == 'refs/heads/main' && github.actor == 'silvergrid' && github.triggering_actor == 'silvergrid'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Update the exact build in the existing owner testing group
        env:
          FAMCALL_APPLE_API_KEY_JSON: ${{ secrets.FAMCALL_APPLE_API_KEY_JSON }}
          FAMCALL_IOS_BUILD: ${{ inputs.ios_build }}
        run: |
          version=$(node -p "require('./apps/mobile/package.json').version")
          node scripts/finish-testflight.mjs "$FAMCALL_IOS_BUILD" "$version"
