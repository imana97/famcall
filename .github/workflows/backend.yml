name: Deploy backend and website
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Reviewed deployment scope
        type: choice
        options: [all, website, apk-website, backend, backend-permissions]
        default: all
        required: true
      apk_run_id:
        description: Approved APK preparation workflow run, required for apk-website
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: famcall-backend
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'silvergrid/famcall' && github.ref == 'refs/heads/main' && github.actor == 'silvergrid' && github.triggering_actor == 'silvergrid'
    environment: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: inputs.scope != 'backend-permissions' && inputs.scope != 'apk-website'
      - run: npm run typecheck && npm run lint && npm run build:backend
        if: inputs.scope != 'backend-permissions' && inputs.scope != 'apk-website'
      - name: Verify the approved APK artifact source
        if: inputs.scope == 'apk-website'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAMCALL_APK_RUN_ID: ${{ inputs.apk_run_id }}
        run: node scripts/check-apk-artifact-source.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.scope == 'apk-website'
        with:
          name: famcall-apk-website
          path: website/
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: famcall
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: inputs.scope == 'website' || inputs.scope == 'all' || inputs.scope == 'apk-website'
        with:
          distribution: temurin
          java-version: '25'
      - name: Deploy the reviewed main commit
        if: inputs.scope != 'backend-permissions'
        env:
          DEPLOY_SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$DEPLOY_SCOPE" = apk-website ]; then
            node scripts/preserve-website-download.mjs --local
          fi
          if [ "$DEPLOY_SCOPE" = website ] || [ "$DEPLOY_SCOPE" = all ]; then
            node scripts/preserve-website-download.mjs
          fi
          case "$DEPLOY_SCOPE" in
            website) target=hosting ;;
            apk-website) target=hosting ;;
            backend) target=firestore,functions ;;
            all) target=firestore,functions,hosting ;;
            *) exit 1 ;;
          esac
          # Accept the reviewed event-handler retry policies in noninteractive CI.
          npx --yes firebase-tools@15.5.1 deploy --project famcall --only "$target" --non-interactive --force
      - name: Reconcile private event target invocation permissions
        if: inputs.scope != 'website' && inputs.scope != 'apk-website'
        run: python3 infra/ensure-event-invocation.py --project famcall --region us-east1 --apply
      - name: Verify event target invocation permissions
        if: inputs.scope != 'website' && inputs.scope != 'apk-website'
        run: python3 infra/ensure-event-invocation.py --project famcall --region us-east1

